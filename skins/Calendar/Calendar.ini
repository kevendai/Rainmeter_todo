[Rainmeter]
Update=100
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,1
Blur=#ThemeBlur#
OnRefreshAction=["#@#CalendarHost.exe" "Startup"]

[Metadata]
Name=Today Calendar
Author=Rainmeter Desktop Widgets
Information=Today's CalDAV events with one-way conversion to timed tasks.
Version=1.3.4

[Variables]
FontFace=Microsoft YaHei UI
TextColor=21,32,48,255
MutedColor=92,108,130,255
AccentColor=25,108,212,255
OngoingColor=20,118,66,255
ConflictColor=198,52,60,255
BorderColor=198,216,232,210
SubtleColor=75,91,113,255
AccentFill=32,112,214,255
PanelColor=239,248,255,248
CardColor=247,251,255,242
DoneCardColor=239,249,244,238
PanelHighlightColor=255,255,255,180
DividerColor=202,218,232,170
ThemeBlur=0

@IncludeTheme=#@#Theme.inc
@Include=#@#Generated.inc


[MeasureRollover]
Measure=Time
Format=%Y-%m-%d %H:%M
UpdateDivider=9000
OnChangeAction=["#@#CalendarHost.exe" "Rollover"]
